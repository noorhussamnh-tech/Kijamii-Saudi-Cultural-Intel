name: Saudi Trends Update

on:
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20   # room for the rebase in "Commit data"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytrends anthropic --break-system-packages
      - run: python update_trends.py 
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TIKTOK_ACTOR: ${{ vars.APIFY_TIKTOK_ACTOR }}
          APIFY_GOOGLE_ACTOR: ${{ vars.APIFY_GOOGLE_ACTOR }}
          TIKTOK_DIRECT_HOURS: ${{ vars.TIKTOK_DIRECT_HOURS }}
          TIKTOK_MIN_POSTS: ${{ vars.TIKTOK_MIN_POSTS }}
          TIKTOK_MIN_VIEWS_PER_POST: ${{ vars.TIKTOK_MIN_VIEWS_PER_POST }}
          TIKTOK_MIN_CREATOR_FOLLOWERS: ${{ vars.TIKTOK_MIN_CREATOR_FOLLOWERS }}
          GOOGLE_WINDOW_HOURS: ${{ vars.GOOGLE_WINDOW_HOURS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit data
        run: |
          git config user.name  "Kijamii Radar Bot"
          git config user.email "actions@github.com"
          git diff --quiet data.json && exit 0
          git add data.json
          git commit -m "Trends update $(date -u +'%d %b %Y %H:%M')"
          # main can move while we scrape (a re-run, or an overlapping tick).
          # Replay our data commit on top instead of failing the whole run;
          # on a data.json clash our fresher scrape wins.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  # Deploy is its own job (GitHub's standard Pages layout): by the time it starts,
  # the artifact from the update job is registered, so deploy-pages can find it.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
