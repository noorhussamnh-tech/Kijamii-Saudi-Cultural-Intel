name: Saudi Trends Update

on:
  schedule:
    - cron: '0 5,11,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python update_trends.py
      - run: |
          git config user.name  "Kijamii Radar Bot"
          git config user.email "actions@github.com"
          git diff --quiet data.json || (git add data.json && git commit -m "Trends update $(date -u +'%d %b %Y %H:%M')" && git push)
