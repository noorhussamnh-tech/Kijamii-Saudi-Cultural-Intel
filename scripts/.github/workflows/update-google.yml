name: Update Google Trends

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update-google:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Google Trends
        run: python scripts/update_google.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data: update Google Trends [$(date -u '+%d %b %Y')]"
          git push
